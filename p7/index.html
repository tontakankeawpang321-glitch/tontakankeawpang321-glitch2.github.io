<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Ebook Maker Pro (Stable Mobile Edition)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Sarabun", sans-serif;
            background: #0f0f0f; color: #eee;
            overflow: hidden; overscroll-behavior-y: none;
            transition: background 0.3s, color 0.3s;
        }

        body.dark { background: #0f0f0f; color: #eee; }
        body.light { background: #ffffff; color: #111; }

        .topbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 55px;
            background: #1a1a1a; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; z-index: 200;
        }
        .bottombar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background: #1a1a1a; border-top: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; z-index: 200; gap: 10px;
        }
        body.light .topbar, body.light .bottombar { background: #f0f0f0; border-color: #ddd; }

        button {
            padding: 8px 12px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-family: "Sarabun", sans-serif;
            transition: transform 0.1s, background 0.2s; touch-action: manipulation;
        }
        button:active { transform: scale(0.95); }
        .control-btn { 
            background: #333; color: #fff; border: 1px solid #555; 
            display: flex; align-items: center; justify-content: center; min-height: 38px;
        }
        body.light .control-btn { background: #e0e0e0; color: #111; border-color: #ccc; }
        .nav-btn { 
            background: #2196F3; color: white; font-size: 18px; font-weight: bold; width: 50px; height: 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .slider-container { position: absolute; top: 55px; bottom: 60px; left: 0; right: 0; overflow: hidden; background: inherit; }
        .slider { display: flex; height: 100%; width: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        body.zoomed .slider { scroll-snap-type: none !important; }
        .slide { min-width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; scroll-snap-align: start; overflow: auto; position: relative; }

        body.vertical-read .slider { flex-direction: column; overflow-x: hidden; overflow-y: auto; scroll-snap-type: none; }
        body.vertical-read .slide { min-width: 100%; width: 100%; height: auto; min-height: 100%; border-bottom: 2px dashed rgba(150,150,150,0.3); padding: 20px 0; display: block; }

        .slide-content { width: 100%; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto; transition: width 0.3s ease; }
        .img-container { width: 100%; display: flex; justify-content: center; }
        .img-wrapper { width: 100%; transition: width 0.3s ease-out; position: relative; }
        
        .slide img { display: block; width: 100%; height: auto; max-height: calc(100vh - 115px); object-fit: contain; pointer-events: none; }
        body.vertical-read .slide img { max-height: none; }

        .toc-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 240; display: none; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(2px); }
        .toc-backdrop.show { display: block; opacity: 1; }
        .toc { position: fixed; top: 55px; left: 0; width: 280px; height: calc(100% - 55px); background: #1b1b1b; overflow-y: auto; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 10px; z-index: 250; box-shadow: 2px 0 15px rgba(0,0,0,0.5); padding-bottom: 70px; }
        body.light .toc { background: #f9f9f9; box-shadow: 2px 0 15px rgba(0,0,0,0.1); }
        .toc.show { transform: translateX(0); }
        .toc-item-wrapper { display: flex; align-items: center; margin-bottom: 4px; border-radius: 6px; transition: background 0.2s; }
        .toc-item-wrapper:active { background: rgba(255,255,255,0.2); }
        body.light .toc-item-wrapper:active { background: rgba(0,0,0,0.1); }
        .toc-item-wrapper.active { background: #2196F3; color: white; }
        .toc-text { flex-grow: 1; padding: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; text-decoration: none; color: inherit; font-size: 15px; }

        .range-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input[type=range] { width: 100%; max-width: 350px; margin-top: 5px; accent-color: #2196F3; height: 4px; }
        .page-info { font-size: 13px; font-weight: 600; margin-bottom: -2px;}
    </style>
</head>

    let currentZoom = 100;
    let totalSlides = 162;
    let isProgrammaticScroll = false;
    
    function toggleTheme() {
        if(document.body.classList.contains('light')) {
            document.body.classList.remove('light'); document.body.classList.add('dark'); document.getElementById('themeBtn').innerText = '☀️';
        } else {
            document.body.classList.remove('dark'); document.body.classList.add('light'); document.getElementById('themeBtn').innerText = '🌙';
        }
    }

    function buildTOC() {
        const toc = document.getElementById("toc"); toc.innerHTML = '';
        document.querySelectorAll('.slide').forEach((slide, index) => { 
            let name = slide.getAttribute('data-name') || `หน้า ${index + 1}`; 
            const wrapper = document.createElement('div'); wrapper.className = 'toc-item-wrapper'; wrapper.id = `toc-wrap-${index}`;
            const link = document.createElement('a'); link.className = 'toc-text'; link.innerText = name; link.href = `#slide-${index}`;
            link.onclick = (e) => { e.preventDefault(); goSlide(index); toggleTOC(); };
            wrapper.appendChild(link); toc.appendChild(wrapper);
        });
    }

    function toggleTOC() { document.getElementById("toc").classList.toggle("show"); document.getElementById("tocBackdrop").classList.toggle("show"); }

    function toggleLayout() {
        document.body.classList.toggle('vertical-read');
        const btn = document.getElementById('layoutBtn'); const isVertical = document.body.classList.contains('vertical-read');
        btn.innerText = isVertical ? "📖 แนวนอน" : "📜 แนวตั้ง";
        document.querySelectorAll('.img-wrapper').forEach(el => { el.style.width = isVertical ? '100%' : currentZoom + '%'; });
        const currentIndex = parseInt(document.getElementById('pageSlider').value) || 0;
        setTimeout(() => goSlide(currentIndex), 100);
    }

    function adjustZoom(change) {
        currentZoom += (change * 25); 
        if(currentZoom <= 50) currentZoom = 50; if(currentZoom >= 300) currentZoom = 300;
        document.querySelectorAll('.img-wrapper').forEach(el => { el.style.width = currentZoom + "%"; });
        if (currentZoom > 100 && !document.body.classList.contains('vertical-read')) { document.body.classList.add("zoomed"); } 
        else { document.body.classList.remove("zoomed"); }
    }

    function next() { const current = parseInt(document.getElementById('pageSlider').value); if(current < totalSlides - 1) goSlide(current + 1); }
    function prev() { const current = parseInt(document.getElementById('pageSlider').value); if(current > 0) goSlide(current - 1); }

    function goSlide(index) { 
        index = parseInt(index); isProgrammaticScroll = true;
        const target = document.getElementById(`slide-${index}`); if(!target) return;
        if (document.body.classList.contains('vertical-read')) { slider.scrollTo({top: target.offsetTop - 50, behavior: "smooth"}); } 
        else { target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' }); }
        updatePageUI(index); window.history.replaceState(null, null, `#slide-${index}`);
        setTimeout(() => { isProgrammaticScroll = false; }, 600);
    }

    function updatePageUI(index) {
        index = Math.round(index); 
        const sliderInput = document.getElementById("pageSlider"); const pageNum = document.getElementById("pageNum");
        document.querySelectorAll('.toc-item-wrapper').forEach(d => d.classList.remove('active'));
        const activeToc = document.getElementById(`toc-wrap-${index}`); 
        if(activeToc) { activeToc.classList.add('active'); const tocPanel = document.getElementById("toc"); tocPanel.scrollTop = activeToc.offsetTop - (tocPanel.offsetHeight / 2); }
        if(sliderInput && sliderInput.value != index) sliderInput.value = index; 
        if(pageNum) pageNum.innerText = Number(index) + 1; 
    }

    const observerOptions = { root: document.getElementById('slider'), rootMargin: '0px', threshold: 0.51 };
    const slideObserver = new IntersectionObserver((entries) => {
        if(isProgrammaticScroll) return; 
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const index = parseInt(entry.target.id.replace('slide-', '')); updatePageUI(index); window.history.replaceState(null, null, `#${entry.target.id}`);
            }
        });
    }, observerOptions);

    window.addEventListener('DOMContentLoaded', () => {
        buildTOC();
        document.querySelectorAll('.slide').forEach(slide => { slideObserver.observe(slide); });
        if (window.location.hash) {
            const hashIndex = window.location.hash.replace('#slide-', '');
            if (!isNaN(hashIndex)) {
                document.getElementById('slider').style.scrollBehavior = 'auto'; goSlide(hashIndex);
                setTimeout(() => { document.getElementById('slider').style.scrollBehavior = 'smooth'; }, 100);
            }
        } else { updatePageUI(0); }
    });
</script>
</body>
</html>
